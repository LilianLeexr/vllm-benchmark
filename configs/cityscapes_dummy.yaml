task_name: cityscapes_semseg
generation_version: dummy-present-v1
output_root: ../outputs
# Empty so the model sees exactly RINO's segmentation prompt.
system_prompt: ""
dataset:
  path: cityscapes.py
  raw_path: cityscapes
  params:
    class_list: present # RINO: only GT-present classes; all = Vision Banana's full 19-class list
    mode: single # RINO's Cityscapes setting; hierarchical adds a 7-group coarse pass
    max_samples: 4
    max_size: [1024, 1024]
    shrink_mode: scale
    size_multiple: 32 # Qwen-Image 2.1 requires dimensions divisible by 32.
evaluator:
  path: semseg.py
  params:
    decode_space: rgb # RINO default; lab is optional
aggregator:
  path: semseg.py
  params:
    decode_space: rgb
    refine: true # also report *_refined (5x5 mode filter + blobs < 100 px)
    refine_window: 5
    refine_min_area: 100
model:
  backend: dummy
  id: white-background-dummy-v1
trials: 1
base_seed: 42
concurrency: 3
retries:
  max_attempts: 3
  base_delay_s: 1
  max_delay_s: 30
save_inputs: true
s3:
  enabled: false
