# Full validation split, no subset.
task_name: ade20k_semseg
generation_version: full-qwen21-bf16-named-freq-maxpx-s40 # change whenever model, steps or prompts change
output_root: ../outputs
# Empty so the model sees exactly RINO's segmentation prompt.
system_prompt: ""
dataset:
  path: ade20k.py
  raw_path: ade20k
  params:
    mode: single # one 150-class pass; coarse_fine_* gives the 10-group score from the same outputs
    palette: named # colour names that match their RGB values, unlike RINO's palette
    color_order: frequency # colours handed out by dataset-wide class frequency, not this image's GT
    max_samples: null # e.g. 5 for a speed check (keep a separate generation_version)
    max_size: [1024, 1024]
    max_pixels: 524288 # 1024x512; the 960x960 and 1024x1024 images ran out of memory on a 24 GB A10G
    shrink_mode: scale
    size_multiple: 32 # Qwen-Image 2.1 requires dimensions divisible by 32.
evaluator:
  path: semseg.py
  params:
    decode_space: rgb # RINO default; lab is optional
aggregator:
  path: semseg.py
  params:
    decode_space: rgb
    refine: true # also report *_refined (5x5 mode filter + blobs < 100 px)
    refine_window: 5
    refine_min_area: 100
model:
  backend: qwen
  id: Qwen/Qwen-Image-2.1
  revision: 790c92633540aa0cb11d9abf19eb46d861714758
  cache_dir: ../model-cache
  profile: custom # A10G 24 GB: bf16 transformer and VAE on the GPU; the 17 GB text encoder is CPU-offloaded
  options:
    transformer_precision: bf16
    text_encoder_precision: bf16
    text_encoder_cpu_offload: true
    vae_precision: bf16
    num_inference_steps: 40 # same as the papers and the team's other tasks
trials: 1
base_seed: 42
concurrency: 3 # Remote only. Local Qwen always uses one worker.
retries:
  max_attempts: 3
  base_delay_s: 1
  max_delay_s: 30
save_inputs: true
s3:
  enabled: false
