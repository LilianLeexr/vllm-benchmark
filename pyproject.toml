[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "visionbench"
version = "0.1.0"
description = "Image-to-image model benchmark infrastructure for vision tasks"
requires-python = ">=3.11,<3.13"
dependencies = [
  "accelerate>=1.9",
  "bitsandbytes>=0.46",
  "boto3>=1.39",
  "diffusers @ git+https://github.com/huggingface/diffusers.git@main",
  "huggingface-hub>=0.34",
  "ipykernel>=6.30",
  "jupyterlab>=4.4",
  "pillow>=11.3",
  "python-dotenv>=1.1",
  "pyyaml>=6.0",
  "pytest>=8.4",
  "torch>=2.7",
  "transformers>=5.17",
  "torchvision>=0.29.0",
  "scipy>=1.17.1",
]

[project.scripts]
visionbench = "visionbench.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["visionbench"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
